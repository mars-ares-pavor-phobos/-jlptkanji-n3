<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Мастер Кандзи N3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #e0e0e0;
        --ink-light: #a0a0a0;
        --paper: #0a0a0a;
        --paper-warm: #1a1a1a;
        --paper-dark: #252525;

        --vermillion: #ff5252;
        --vermillion-soft: #ff8a80;
        --gold: #ffd740;
        --gold-soft: #ffe57f;
        --sage: #9ccc65;
        --sage-soft: #c5e1a5;
        --indigo: #536dfe;
        --indigo-soft: #8c9eff;
        --success: #69f0ae;
        --error: #ff5252;

        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.6);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.8);

        --font-display: "Playfair Display", "Noto Serif JP", serif;
        --font-body: "Cormorant Garamond", "Noto Serif JP", serif;
        --font-jp: "Noto Serif JP", serif;
        --font-jp-sans: "Noto Sans JP", sans-serif;

        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        background: #000;
        overscroll-behavior-y: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        font-family: var(--font-body);
        background: #000000;
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.05;
        pointer-events: none;
        z-index: -1;
      }

      .app-container {
        width: 100%;
        max-width: 520px;
        height: 85vh;
        max-height: 900px;
        min-height: 600px;
        background: var(--paper);
        border-radius: 24px;
        box-shadow: var(--shadow-xl);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      @media (max-width: 600px) {
        body {
          padding: 0;
          align-items: flex-start;
        }

        .app-container {
          max-width: none;
          height: 100dvh;
          max-height: none;
          min-height: 100dvh;
          border-radius: 0;
          border: none;
        }

        .kanji-grid {
          grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        }

        .kanji-item {
          font-size: 1.8rem;
        }
      }

      .header {
        padding: 20px 24px;
        background: linear-gradient(135deg, #000 0%, #151515 100%);
        color: var(--ink);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
        z-index: 10;
      }

      .header h1 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .header-subtitle {
        font-family: var(--font-jp);
        font-size: 0.75rem;
        opacity: 0.85;
        letter-spacing: 0.1em;
      }

      .lang-switch {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 8px 16px;
        border-radius: 30px;
        cursor: pointer;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--ink);
        transition: all 0.3s;
        z-index: 2;
      }

      .lang-switch:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .lang-switch:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .screen {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        animation: fadeIn 0.4s var(--ease-out-expo);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .home-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 30px 24px;
        overflow-y: auto;
      }

      .home-intro {
        text-align: center;
        margin-bottom: 30px;
        margin-top: auto;
        flex-shrink: 0;
      }

      .home-intro h2 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        margin-bottom: 10px;
        color: var(--ink);
      }

      .home-intro p {
        font-size: 1rem;
        color: var(--ink-light);
        opacity: 1;
        line-height: 1.6;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: auto;
        flex-shrink: 0;
      }

      @media (min-width: 400px) {
        .menu-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .menu-card {
        appearance: none;
        -webkit-appearance: none;
        padding: 30px 20px;
        min-height: 160px;
        width: 100%;
        background: linear-gradient(
          145deg,
          var(--paper-warm) 0%,
          var(--paper) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s var(--ease-out-expo);
        box-shadow: var(--shadow-sm);
        position: relative;
        color: inherit;
        font: inherit;
        text-align: center;
      }

      .menu-card:active {
        transform: scale(0.98);
      }

      .menu-card:hover {
        border-color: var(--vermillion);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      .menu-card-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        font-size: 22px;
        color: var(--ink);
      }

      .menu-card span {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 4px;
      }

      .menu-card-jp {
        font-family: var(--font-jp);
        font-size: 0.75rem;
        opacity: 0.8;
        letter-spacing: 0.1em;
      }

      .back-row {
        padding: 16px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: var(--paper-warm);
        flex-shrink: 0;
      }

      .back-btn {
        background: none;
        border: none;
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
      }

      .kanji-grid-container {
        padding: 20px;
        flex-grow: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--paper-dark) transparent;
      }

      .kanji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
        gap: 12px;
        padding-bottom: 40px;
      }

      .kanji-item {
        appearance: none;
        -webkit-appearance: none;
        aspect-ratio: 1;
        width: 100%;
        padding: 0;
        background: var(--paper-warm);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: var(--font-jp);
        font-size: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        cursor: pointer;
        color: var(--ink);
        transition: transform 0.2s;
        will-change: transform;
      }

      .kanji-item:active {
        transform: scale(0.95);
        background: var(--paper-dark);
      }

      .quiz-config {
        padding: 24px;
        flex-grow: 1;
        overflow-y: auto;
      }

      .config-section {
        margin-bottom: 24px;
      }

      .config-section-title {
        font-size: 0.95rem;
        text-transform: none;
        letter-spacing: 0.025em;
        color: var(--ink-light);
        margin-bottom: 12px;
        padding-left: 4px;
        font-weight: 600;
        line-height: 1.5;
      }

      .mode-option {
        appearance: none;
        -webkit-appearance: none;
        padding: 16px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: var(--paper-warm);
        border-radius: 16px;
        cursor: pointer;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: inherit;
        font: inherit;
        text-align: left;
      }

      .mode-option.selected {
        border-color: var(--vermillion);
        background: rgba(255, 82, 82, 0.08);
      }

      .mode-option-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mode-option.selected .mode-option-icon {
        background: var(--vermillion);
        color: #000;
      }

      .count-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .count-btn {
        appearance: none;
        -webkit-appearance: none;
        padding: 14px 0;
        width: 100%;
        text-align: center;
        background: var(--paper-warm);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        color: var(--ink);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        font: inherit;
      }

      .count-btn:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      .count-btn.selected {
        background: var(--vermillion);
        color: #000;
        border-color: var(--vermillion);
      }

      .start-btn {
        background: var(--ink);
        color: #000;
        border: none;
        padding: 18px;
        border-radius: 14px;
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      .start-btn:active {
        transform: scale(0.98);
      }

      .start-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .quiz-area {
        padding: 24px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .quiz-progress {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .progress-container {
        flex-grow: 1;
        margin-right: 20px;
      }

      .progress-bar {
        height: 6px;
        background: var(--paper-dark);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 6px;
      }

      .progress-fill {
        height: 100%;
        background: var(--vermillion);
        width: 0%;
        transition: width 0.3s ease;
      }

      .progress-text {
        font-size: 0.95rem;
        color: var(--ink-light);
        font-variant-numeric: tabular-nums;
      }

      .score-badge {
        padding: 6px 14px;
        background: rgba(105, 240, 174, 0.1);
        border-radius: 20px;
        color: var(--success);
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .question-card {
        text-align: center;
        margin: 20px 0 40px;
      }

      .question-type {
        color: var(--ink-light);
        margin-bottom: 10px;
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .question-kanji {
        font-family: var(--font-jp);
        font-size: 5.5rem;
        line-height: 1.2;
        color: var(--ink);
      }

      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: auto;
      }

      .option-btn {
        padding: 16px 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--paper-warm);
        border-radius: 14px;
        font-family: var(--font-jp-sans);
        font-size: 1rem;
        cursor: pointer;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--ink);
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      .option-btn:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      .option-btn:active {
        background: var(--paper-dark);
      }

      .option-btn:disabled {
        pointer-events: none;
        opacity: 0.6;
      }

      .option-letter {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.9rem;
        flex-shrink: 0;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: flex-end;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 9999;
      }

      .modal.active {
        opacity: 1;
        pointer-events: all;
      }

      .modal-content {
        background: #151515;
        width: 100%;
        max-width: 520px;
        max-height: 85vh;
        border-radius: 28px 28px 0 0;
        padding: 28px;
        overflow-y: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      }

      .modal.active .modal-content {
        transform: translateY(0);
      }

      .modal-handle {
        width: 40px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin: 0 auto 24px;
        cursor: grab;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .result-badge {
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .result-badge.correct {
        background: rgba(105, 240, 174, 0.15);
        color: var(--success);
      }
      .result-badge.incorrect {
        background: rgba(255, 82, 82, 0.15);
        color: var(--error);
      }

      .close-modal {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }

      .close-modal:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .lang-switch:focus-visible,
      .menu-card:focus-visible,
      .back-btn:focus-visible,
      .mode-option:focus-visible,
      .count-btn:focus-visible,
      .start-btn:focus-visible,
      .option-btn:focus-visible,
      .close-modal:focus-visible,
      .btn-primary:focus-visible,
      .btn-secondary:focus-visible,
      .kanji-item:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .kanji-display {
        text-align: center;
        margin-bottom: 24px;
      }
      .kanji-big {
        font-size: 5rem;
        font-weight: 600;
        color: var(--ink);
        font-family: var(--font-jp);
      }

      .readings-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 24px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
      }

      .reading-group {
        text-align: center;
        flex: 1;
        min-width: 0;
      }
      .reading-label {
        font-size: 0.9rem;
        color: var(--ink-light);
        margin-bottom: 4px;
        text-transform: none;
        letter-spacing: 0.025em;
        font-weight: 600;
        line-height: 1.5;
      }
      .reading-value {
        font-size: 1.1rem;
        color: var(--ink);
        font-weight: 500;
        font-family: var(--font-jp);
        line-height: 1.7;
        overflow-wrap: anywhere;
      }

      .info-card {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .info-label {
        font-size: 0.95rem;
        text-transform: none;
        letter-spacing: 0.025em;
        color: var(--ink-light);
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        line-height: 1.5;
      }

      .info-text {
        font-size: 1.05rem;
        line-height: 1.9;
      }

      .sentence-ruby {
        font-family: var(--font-jp);
        font-size: 1.2rem;
        line-height: 2.4;
        color: var(--ink);
      }

      .sentence-translation {
        margin-top: 8px;
        color: var(--ink-light);
        font-style: italic;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .word-chip {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        gap: 6px;
      }
      .word-chip:last-child {
        border-bottom: none;
      }

      @media (min-width: 500px) {
        .word-chip {
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
        }
        .word-meaning {
          text-align: right;
        }
      }

      .word-kanji {
        color: var(--indigo-soft);
        font-weight: 600;
        font-size: 1.2rem;
        flex-shrink: 0;
        font-family: var(--font-jp);
        line-height: 2.3;
        max-width: 100%;
      }
      .word-meaning {
        color: var(--ink-light);
        font-size: 1.05rem;
        line-height: 1.7;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      ruby {
        ruby-position: over;
        ruby-align: center;
      }
      rt {
        font-size: 0.7em;
        line-height: 1.3;
        color: var(--vermillion-soft);
        opacity: 1;
      }

      .btn-primary {
        width: 100%;
        padding: 18px;
        border: none;
        background: var(--ink);
        color: #000;
        font-weight: 700;
        font-size: 1.1rem;
        border-radius: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.3s;
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: var(--paper-dark);
        color: var(--ink-light);
      }

      .btn-secondary {
        width: 100%;
        padding: 16px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: var(--ink);
        border-radius: 16px;
        cursor: pointer;
        margin-top: 10px;
        font-weight: 600;
        transition: border-color 0.2s;
      }

      .btn-secondary:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }

      .results-content {
        text-align: center;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
      }
      .results-score {
        font-size: 5rem;
        font-weight: 700;
        color: var(--ink);
        line-height: 1;
        margin-bottom: 10px;
      }
      .results-score span {
        color: var(--vermillion);
      }
      .results-decoration {
        font-size: 4rem;
        margin-bottom: 20px;
      }
      .results-label {
        color: var(--ink-light);
        font-size: 1rem;
        margin-bottom: 10px;
      }
      .results-message {
        font-size: 1.2rem;
        color: var(--ink);
        margin-bottom: 20px;
      }

      .mistakes-title {
        font-size: 1.1rem;
        color: var(--vermillion);
        margin-top: 30px;
        margin-bottom: 15px;
        text-align: left;
        font-weight: 600;
      }
      .mistakes-list {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 5px;
        margin-bottom: 20px;
        text-align: left;
      }
      .mistake-item {

function getSecureRandom() {
  if (window.crypto && window.crypto.getRandomValues) {
    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    return array[0] / (0xffffffff + 1);
  }
  return Math.random();
}

function fisherYatesShuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(getSecureRandom() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isValidAnswerValue(value) {
  return typeof value === "string" && value.trim() !== "" && value !== "-";

  if (subtype === "kunyomi") return kanji.kunyomi;

function handleKeydown(e) {
  if (e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;
  const modalOpen = !DOM.detailModal.hidden;
  if (modalOpen && e.key === "Tab") {
    const controls = [DOM.detailModalContent, ...Array.from(DOM.detailModalContent.querySelectorAll(
      'button:not(:disabled), [tabindex="0"]',
    )).filter((el) => el.getClientRects().length > 0)];
    const first = controls[0];
    const last = controls[controls.length - 1];
    if (!controls.includes(document.activeElement)) {
      e.preventDefault();
      (e.shiftKey ? last : first)?.focus({ preventScroll: true });
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last?.focus({ preventScroll: true });
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first?.focus({ preventScroll: true });
    }
    return;
  }
  if (e.repeat) return;
  if (modalOpen) {
    if (e.key === "Escape" && appState.isReferenceModal) {
      e.preventDefault();
      closeModal();
    } else if (e.key === "Enter" && !appState.isReferenceModal) {
      e.preventDefault();
      nextQuestion();
    }
    return;
  }
  if (e.target?.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (appState.currentScreen === "quiz") {
    const keyMap = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 };
    const physicalKeys = { KeyA: 0, KeyB: 1, KeyC: 2, KeyD: 3, Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
    const index = physicalKeys[e.code] ?? keyMap[e.key.toLowerCase()];
    const button = DOM.optionsGrid.querySelectorAll(".option-btn")[index];
    if (button && !button.disabled) {
      e.preventDefault();
      button.click();
    }
  }
}

const furiganaCache = new Map();
const kanjiPattern = /^[\p{Script=Han}々〆]+$/u;

function normalizeKana(text) {
  return String(text || "")
    .normalize("NFKC")
    .replace(/[ァ-ヶ]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0x60));
}

function splitFurigana(surface, reading) {
  const text = String(surface || "");
  const kana = normalizeKana(reading);
  const key = `${text}\0${kana}`;
  if (furiganaCache.has(key)) return furiganaCache.get(key);

  const tokens = text.match(/[\p{Script=Han}々〆]+|[^\p{Script=Han}々〆]+/gu) || [];
  const memo = new Map();
  // Kana in the written word anchors the reading. Continuous kanji stay grouped,
  // so irregular readings such as 今日 and 大人 are never guessed per character.
  function align(index, offset) {
    if (index === tokens.length) return offset === kana.length ? [] : null;
    const stateKey = `${index}:${offset}`;
    if (memo.has(stateKey)) return memo.get(stateKey);

    const token = tokens[index];
    let result = null;
    if (!kanjiPattern.test(token)) {
      const literal = normalizeKana(token);
      if (kana.startsWith(literal, offset)) {
        const rest = align(index + 1, offset + literal.length);
        if (rest !== null) result = [{ text: token }, ...rest];
      }
    } else {
      for (let end = offset + 1; end <= kana.length; end++) {
        const candidate = kana.slice(offset, end);
        if (!/^[\p{Script=Hiragana}ー]+$/u.test(candidate)) continue;
        const rest = align(index + 1, end);
        if (rest !== null) {
          result = [{ kanji: token, reading: candidate }, ...rest];
          break;
        }
      }
    }
    memo.set(stateKey, result);
    return result;
  }

  const parts = tokens.some((token) => kanjiPattern.test(token))
    ? align(0, 0)
    : [{ text }];
  furiganaCache.set(key, parts);
  return parts;
}

function renderFurigana(surface, reading) {
  const parts = splitFurigana(surface, reading);
  // Preserve the written word if its reading cannot be aligned safely.
  if (parts === null) return escapeHTML(surface);
  return parts.map((part) => part.kanji
    ? `<ruby lang="ja">${escapeHTML(part.kanji)}<rt>${escapeHTML(part.reading)}</rt></ruby>`
    : escapeHTML(part.text)).join("");
}

function generateRubyHTML(rubyData) {
  if (!rubyData || !Array.isArray(rubyData)) return "";

  return rubyData
    .map((item) => {
      if (!item) return "";
      if (item.kanji && item.reading) {
        return renderFurigana(item.kanji, item.reading);
      }
      return escapeHTML(item.text || "");
    })
    .join("");
}

function escapeHTML(value) {
  const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value ?? "").replace(/[&<>"']/g, (char) => entities[char]);
}

function clearTimer() {
  if (appState.timerInterval !== null) {
    clearInterval(appState.timerInterval);
    appState.timerInterval = null;
  }
  appState.cardUnlockAt = 0;
}

function startCardTimer() {
  clearTimer();
  appState.cardUnlockAt = performance.now() + CARD_MINIMUM_SECONDS * 1000;
  DOM.nextBtn.disabled = true;
  document.getElementById("cardStatus").textContent = "";
  const updateCountdown = () => {
    const remaining = Math.max(0, Math.ceil((appState.cardUnlockAt - performance.now()) / 1000));
    const label = uiTexts[appState.language].nextBtn;
    document.getElementById("nextBtnText").textContent = remaining > 0 ? `${label} (${remaining})` : label;
    if (remaining === 0) {
      clearInterval(appState.timerInterval);
      appState.timerInterval = null;
      DOM.nextBtn.disabled = false;
      document.getElementById("cardStatus").textContent = uiTexts[appState.language].cardReady;
    }
  };
  updateCountdown();
  appState.timerInterval = setInterval(updateCountdown, 250);
}

function openDetailModal() {
  const modal = DOM.detailModal;
  const scrollArea = DOM.detailModalContent;
  const version = ++appState.modalVersion;
  if (modal.hidden) appState.modalReturnFocus = document.activeElement;
  // Reset the classic card before revealing it, after focus, and on the next
  // paint so the browser cannot restore the previous card's scroll position.
  const resetScroll = () => {
    if (version !== appState.modalVersion || modal.hidden) return;
    scrollArea.scrollTop = 0;
    scrollArea.scrollLeft = 0;
  };
  scrollArea.scrollTop = 0;
  scrollArea.scrollLeft = 0;
  modal.hidden = false;
  modal.classList.add("active");
  document.body.classList.add("modal-open");
  DOM.detailModalContent.focus({ preventScroll: true });
  document.getElementById("appSurface").inert = true;
  resetScroll();
  requestAnimationFrame(resetScroll);
}

function showKanjiDetail(kanjiIndex, isReference = false) {
  const kanji = kanjiDataList[kanjiIndex];
  if (!kanji) return;

  const lang = appState.language;
  const texts = uiTexts[lang];
  appState.isReferenceModal = isReference;
  DOM.detailModalContent.setAttribute("aria-describedby", isReference ? "modalMeaning" : "resultBadgeText modalMeaning");
  document.getElementById("cardStatus").textContent = "";

  DOM.modalKanji.textContent = kanji.char;
  DOM.modalOnyomi.textContent = isValidAnswerValue(kanji.onyomi) ? kanji.onyomi : texts.noReading;
  DOM.modalKunyomi.textContent = isValidAnswerValue(kanji.kunyomi) ? kanji.kunyomi : texts.noReading;
  DOM.modalOnyomi.lang = isValidAnswerValue(kanji.onyomi) ? "ja" : lang;
  DOM.modalKunyomi.lang = isValidAnswerValue(kanji.kunyomi) ? "ja" : lang;
  DOM.modalMeaning.textContent = kanji.meanings[lang] || "";

  const wordsContainer = DOM.modalWords;
  wordsContainer.innerHTML = "";

  if (kanji.words && kanji.words.length > 0) {
    const fragment = document.createDocumentFragment();
    kanji.words.forEach((word) => {
      const chip = document.createElement("div");
      chip.className = "word-chip";
      const meaning = lang === "ru" ? word.mean_ru : word.mean_uz;
      chip.innerHTML = `<span class="word-kanji" lang="ja">${renderFurigana(
        word.kanji, word.kana,
      )}</span><span class="word-meaning">${escapeHTML(
        meaning,
      )}</span>`;
      fragment.appendChild(chip);
    });
    wordsContainer.appendChild(fragment);
  } else {
    wordsContainer.textContent = texts.noWords;
  }

  if (kanji.sentence) {
    DOM.modalSentenceRuby.innerHTML = generateRubyHTML(kanji.sentence.rubyData);
    DOM.modalSentenceTranslation.textContent =
      kanji.sentence.translation?.[lang] || "";

    const grammarCard = DOM.modalGrammar.closest(".grammar-card");
    if (kanji.sentence.grammarPoint?.[lang]) {
      DOM.modalGrammar.textContent = kanji.sentence.grammarPoint[lang];
      grammarCard.classList.remove("hidden");
    } else {
      grammarCard.classList.add("hidden");
    }
  } else {
    DOM.modalSentenceRuby.innerHTML = "";
    DOM.modalSentenceTranslation.textContent = "";
    DOM.modalGrammar.closest(".grammar-card").classList.add("hidden");
  }

  const badge = DOM.resultBadge;
  const nextBtn = DOM.nextBtn;
  const closeBtn = DOM.closeRefBtn;
  const closeModalBtn = DOM.closeModalBtn;

  if (isReference) {
    badge.classList.add("hidden");
    nextBtn.classList.add("hidden");
    closeBtn.classList.remove("hidden");
    closeModalBtn.classList.remove("hidden");
    closeModalBtn.disabled = false;
    clearTimer();
    nextBtn.disabled = false;
  } else {
    badge.classList.remove("hidden");
    nextBtn.classList.remove("hidden");
    closeBtn.classList.add("hidden");
    closeModalBtn.classList.add("hidden");
    closeModalBtn.disabled = true;

    nextBtn.disabled = true;
  }
  openDetailModal();
  if (!isReference) startCardTimer();
}

function closeModal(force = false, restoreFocus = true) {
  if (!appState.isReferenceModal && !force) return;

  const returnFocus = appState.modalReturnFocus;

  DOM.detailModal.classList.remove("active");
  DOM.detailModal.hidden = true;
  document.getElementById("appSurface").inert = false;
  document.body.classList.remove("modal-open");
  clearTimer();
  appState.isAnswering = false;
  appState.modalReturnFocus = null;
  if (restoreFocus && returnFocus?.isConnected && !returnFocus.disabled) {
    returnFocus.focus({ preventScroll: true });
  }

    if (count === appState.quizCount) {
      btn.classList.add("selected");
      btn.setAttribute("aria-pressed", "true");
    } else {
      btn.setAttribute("aria-pressed", "false");
    }

    const selectCount = () => {
      document.querySelectorAll(".count-btn").forEach((b) => {
        b.classList.remove("selected");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("selected");
      btn.setAttribute("aria-pressed", "true");
      appState.quizCount = count;
      savePreferences();
    };

    btn.addEventListener("click", selectCount);

    fragment.appendChild(btn);
  });

  container.appendChild(fragment);
}

function startQuiz() {
  appState.currentQuestionIndex = 0;
  appState.score = 0;
  appState.isAnswering = false;
  appState.questions = generateQuestions();

  if (appState.questions.length === 0) {
    alert(uiTexts[appState.language].insufficientQuestions);
    return;
  }

  showScreen("quiz");
  showQuestion();
}

function generateQuestions() {
  const questions = [];
  const shuffledKanji = fisherYatesShuffle(kanjiDataList);
  const maxCount =
    appState.quizCount === "all"
      ? shuffledKanji.length
      : Math.min(appState.quizCount, shuffledKanji.length);

  for (const kanji of shuffledKanji) {
    if (questions.length >= maxCount) break;

    let targetType = appState.quizMode;

    if (targetType === "mixed") {
      targetType = getSecureRandom() < 0.5 ? "reading" : "meaning";
    }

    let questionSubtype = "meaning";
    let answerVal = "";

    if (targetType === "reading") {
      const hasOn = isValidAnswerValue(kanji.onyomi);
      const hasKun = isValidAnswerValue(kanji.kunyomi);

      if (hasOn && hasKun) {
        questionSubtype = getSecureRandom() < 0.5 ? "onyomi" : "kunyomi";
      } else if (hasOn) {
        questionSubtype = "onyomi";
      } else if (hasKun) {
        questionSubtype = "kunyomi";
      } else {
        targetType = "meaning";
        questionSubtype = "meaning";
      }

      if (targetType === "reading") {
        answerVal = getAnswerValue(kanji, questionSubtype);
      }
    }

    if (targetType === "meaning" || questionSubtype === "meaning") {
      questionSubtype = "meaning";
      answerVal = getAnswerValue(kanji, questionSubtype);
    }

    if (!isValidAnswerValue(answerVal)) continue;

    const options = generateOptions(kanji, questionSubtype);

    if (options.length < 2) continue;

    questions.push({
      kanji,
      kanjiIndex: kanjiIndexMap.get(kanji.char),
      type: targetType,
      subtype: questionSubtype,
      options,
      correctAnswer: answerVal,
      userAnswer: null,
      isCorrect: false,
    });
  }

  return questions;
}

function generateOptions(correctKanji, subtype) {
  const options = new Set();
  const lang = appState.language;

  const correctVal = getAnswerValue(correctKanji, subtype, lang);

  if (!isValidAnswerValue(correctVal)) return [];

  options.add(correctVal);
  const correctReadings = new Set(
    correctVal.split(/[,、]/).map((value) => value.trim().replace(/\./g, "")),
  );

  const otherKanji = kanjiDataList.filter((k) => k.char !== correctKanji.char);
  const shuffledOthers = fisherYatesShuffle(otherKanji);

  for (const distractorKanji of shuffledOthers) {
    if (options.size >= 4) break;

    let distractorVal = "";

    if (subtype === "onyomi") {
      distractorVal = distractorKanji.onyomi;
    } else if (subtype === "kunyomi") {
      distractorVal = distractorKanji.kunyomi;
    } else {
      distractorVal = distractorKanji.meanings[lang];
    }

    const sharesCorrectReading = subtype !== "meaning" && String(distractorVal || "")
      .split(/[,、]/)
      .some((value) => correctReadings.has(value.trim().replace(/\./g, "")));

    if (isValidAnswerValue(distractorVal) && !options.has(distractorVal) && !sharesCorrectReading) {
      options.add(distractorVal);
    }
  }

  return fisherYatesShuffle([...options]);
}

function showQuestion() {
  const question = appState.questions[appState.currentQuestionIndex];
  if (!question) {
    showResults();
    return;
  }

  const texts = uiTexts[appState.language];
  const progress =
    ((appState.currentQuestionIndex + 1) / appState.questions.length) * 100;

  DOM.progressFill.style.width = `${progress}%`;
  DOM.progressText.textContent = `${
    appState.currentQuestionIndex + 1
  } / ${appState.questions.length}`;
  DOM.scoreText.textContent = appState.score;
  document.getElementById("scoreBadge").setAttribute("aria-label", texts.scoreLabel.replace("{score}", appState.score));
  const progressBar = document.getElementById("quizProgress");
  progressBar.setAttribute("aria-valuemax", appState.questions.length);
  progressBar.setAttribute("aria-valuenow", appState.currentQuestionIndex + 1);

  let typeLabel = "";
  if (question.subtype === "onyomi") {
    typeLabel = texts.questionOnyomi;
  } else if (question.subtype === "kunyomi") {
    typeLabel = texts.questionKunyomi;
  } else {
    typeLabel = texts.questionMeaning;
  }

  DOM.questionType.textContent = typeLabel;
  DOM.questionKanji.textContent = question.kanji.char;

  const optionsGrid = DOM.optionsGrid;
  optionsGrid.innerHTML = "";
  const letters = ["A", "B", "C", "D"];

  const fragment = document.createDocumentFragment();

  question.options.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    if (question.subtype !== "meaning") btn.lang = "ja";
    btn.innerHTML = `<span class="option-letter">${
      letters[index]
    }</span><span>${escapeHTML(option)}</span>`;
    btn.addEventListener("click", () => selectAnswer(option));
    fragment.appendChild(btn);
  });

  optionsGrid.appendChild(fragment);
  appState.isAnswering = false;
  const quizArea = document.getElementById("quizArea");
  quizArea.scrollTop = 0;
  quizArea.scrollLeft = 0;
  DOM.questionType.focus({ preventScroll: true });
}

function selectAnswer(selectedOption) {
  if (appState.isAnswering) return;
  appState.isAnswering = true;

  const buttons = DOM.optionsGrid.querySelectorAll(".option-btn");
  buttons.forEach((btn) => (btn.disabled = true));

  const question = appState.questions[appState.currentQuestionIndex];
  const isCorrect = selectedOption === question.correctAnswer;
  const texts = uiTexts[appState.language];

  question.userAnswer = selectedOption;
  question.isCorrect = isCorrect;

  if (isCorrect) appState.score++;

  const badge = DOM.resultBadge;
  const badgeText = DOM.resultBadgeText;
  const badgeIcon = badge.querySelector("i");

  badge.className = `result-badge ${isCorrect ? "correct" : "incorrect"}`;
  badgeText.textContent = isCorrect ? texts.correct : texts.incorrect;
  badgeIcon.className = isCorrect ? "fas fa-check" : "fas fa-times";
  badgeIcon.innerHTML = iconSVG(isCorrect ? "fa-check" : "fa-times");

  showKanjiDetail(question.kanjiIndex, false);
}

function nextQuestion() {
  if (appState.isReferenceModal || DOM.detailModal.hidden || DOM.nextBtn.disabled || !appState.isAnswering) return;
  if (performance.now() < appState.cardUnlockAt) return;
  closeModal(true, false);
  appState.currentQuestionIndex++;

  if (appState.currentQuestionIndex >= appState.questions.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  const texts = uiTexts[appState.language];
  const total = appState.questions.length;
  const correct = appState.score;
  const percentage = total > 0 ? (correct / total) * 100 : 0;

  document.getElementById("correctCount").textContent = correct;
  document.getElementById("totalCount").textContent = total;

  let emoji, message;
  if (percentage >= 90) {
    emoji = "🏆";
    message = texts.excellentResult;
  } else if (percentage >= 70) {
    emoji = "🎉";
    message = texts.goodResult;
  } else if (percentage >= 50) {
    emoji = "👍";
    message = texts.okResult;
  } else {
    emoji = "📚";
    message = texts.needPractice;
  }

  document.getElementById("resultsEmoji").textContent = emoji;
  document.getElementById("resultsMessage").textContent = message;
  document.getElementById("resultsLabel").textContent = texts.resultsLabel;

  const mistakesContainer = document.getElementById("mistakesList");
  const mistakesTitle = document.getElementById("mistakesTitle");
  mistakesContainer.innerHTML = "";

  const incorrectQuestions = appState.questions.filter((q) => !q.isCorrect);

  if (incorrectQuestions.length > 0) {
    mistakesTitle.textContent = texts.mistakesTitle;
    mistakesTitle.classList.remove("hidden");
    mistakesContainer.classList.remove("hidden");

    const fragment = document.createDocumentFragment();

    incorrectQuestions.forEach((q) => {
      const item = document.createElement("button");
      item.className = "mistake-item";
      item.type = "button";
      item.title = texts.reviewCard.replace("{char}", q.kanji.char);
      item.addEventListener("click", () => showKanjiDetail(q.kanjiIndex, true));

      let typeLabel = "";
      if (q.subtype === "onyomi") typeLabel = texts.onyomiLabel;
      else if (q.subtype === "kunyomi") typeLabel = texts.kunyomiLabel;
      else typeLabel = texts.meaningLabel;

      item.innerHTML = `
              <span class="mistake-kanji" lang="ja">${escapeHTML(q.kanji.char)}</span>
              <span class="mistake-details">
                <span class="mistake-label">${escapeHTML(typeLabel)}</span>
                <span class="mistake-row">
                  <span class="val-incorrect"><span class="sr-only">${escapeHTML(texts.yourAnswer)}: </span>${escapeHTML(q.userAnswer)}</span>
                  <span class="val-correct"><span class="sr-only">${escapeHTML(texts.correctAnswer)}: </span>${escapeHTML(
                    q.correctAnswer,
                  )}</span>
                </span>
              </span>
            `;
      fragment.appendChild(item);
    });

    mistakesContainer.appendChild(fragment);
  } else {
    mistakesTitle.classList.add("hidden");
    mistakesContainer.classList.add("hidden");
  }

  document.getElementById("retryMistakesBtn").classList.toggle("hidden", incorrectQuestions.length === 0);
  saveLastResult();
  showScreen("results");
}

function resetQuizState() {
  clearTimer();
  appState.currentQuestionIndex = 0;
  appState.score = 0;
  appState.questions = [];
  appState.isAnswering = false;
  appState.isReferenceModal = false;
}

function returnToHome() {
  closeModal(true);
  resetQuizState();
  updateUI();
  showScreen("home");
}

function confirmExit() {
  const texts = uiTexts[appState.language];
  if (confirm(texts.exitConfirm)) {
    returnToHome();
  }
}

window.addEventListener("pagehide", () => {
  clearTimer();
});
window.addEventListener("pageshow", (event) => {
  if (event.persisted && !DOM.detailModal.hidden && !appState.isReferenceModal) {
    openDetailModal();
    startCardTimer();
  }
});

document.addEventListener("DOMContentLoaded", init);


// Local result history contains only the most recently completed test.
const RESULT_KEY = "kanji-n3-last-result-v1";
function loadLastResult() {
  try {
    const saved = JSON.parse(localStorage.getItem(RESULT_KEY));
    if (!saved || !["ru", "uz"].includes(saved.language) || !Array.isArray(saved.questions) || !saved.questions.length || saved.questions.length > kanjiDataList.length) return;
    const seen = new Set();
    const valid = saved.questions.every((question) => {
      if (!question || !kanjiIndexMap.has(question.char) || seen.has(question.char)) return false;
      seen.add(question.char);
      return ["onyomi", "kunyomi", "meaning"].includes(question.subtype)
        && typeof question.userAnswer === "string" && question.userAnswer.length < 5000
        && Array.isArray(question.options) && question.options.length >= 2 && question.options.length <= 4
        && question.options.every((value) => typeof value === "string" && value.length < 5000)
        && question.options.includes(question.userAnswer);
    });
    if (valid) appState.lastResult = saved;
  } catch {
    // Malformed or unavailable storage does not prevent studying.
  }
}

function saveLastResult() {
  if (!appState.questions.length || appState.questions.some((question) => question.userAnswer === null)) return;
  appState.lastResult = {
    language: appState.language,
    questions: appState.questions.map((question) => ({
      char: question.kanji.char,
      subtype: question.subtype,
      userAnswer: question.userAnswer,
      options: question.options,
    })),
  };
  try {
    localStorage.setItem(RESULT_KEY, JSON.stringify(appState.lastResult));
  } catch {
    // The latest result remains available for the current page session.
  }
}

function restoreLastResult() {
  const saved = appState.lastResult;
  if (!saved) return;
  appState.language = saved.language;
  savePreferences();
  appState.questions = saved.questions.map((record) => {
    const kanjiIndex = kanjiIndexMap.get(record.char);
    const kanji = kanjiDataList[kanjiIndex];
    const correctAnswer = getAnswerValue(kanji, record.subtype, saved.language);
    return { kanji, kanjiIndex, subtype: record.subtype, type: record.subtype === "meaning" ? "meaning" : "reading",
      options: record.options, correctAnswer, userAnswer: record.userAnswer, isCorrect: correctAnswer === record.userAnswer };
  });
  appState.score = appState.questions.filter((question) => question.isCorrect).length;
  appState.currentQuestionIndex = appState.questions.length;
  appState.isAnswering = false;
  updateUI();
  showResults();
}

function retryMistakes() {
  const mistakes = appState.questions.filter((question) => !question.isCorrect);
  if (!mistakes.length) return;
  appState.questions = fisherYatesShuffle(mistakes).map((question) => ({
    ...question, options: generateOptions(question.kanji, question.subtype), userAnswer: null, isCorrect: false,
  }));
  appState.currentQuestionIndex = 0;
  appState.score = 0;
  appState.isAnswering = false;
  showScreen("quiz");
  showQuestion();
}

// Small inline icons keep controls legible without an icon font or network.
function iconSVG(name) {
  const paths = {
    "fa-book-open": '<path d="M12 5v16M12 5C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 1Z"/>',
    "fa-pen-fancy": '<path d="m4 20 3-9L18 2l4 4-9 11-9 3ZM7 11l6 6M4 20l6-6"/>',
    "fa-arrow-left": '<path d="m12 5-7 7 7 7M5 12h15"/>',
    "fa-language": '<path d="M2 5h12M8 2v3M4 5c0 6 7 10 7 10M12 5c0 6-4 8-10 11M13 21l5-13 5 13M15 17h6"/>',
    "fa-lightbulb": '<path d="M9 21h6M9 17h6v-2a7 7 0 1 0-6 0v2Z"/>',
    "fa-random": '<path d="M3 6h3c4 0 8 12 12 12h3M3 18h3c4 0 8-12 12-12h3m-3-3 3 3-3 3m0 6 3 3-3 3"/>',
    "fa-check": '<path d="m4 12 5 5L20 6"/>',
    "fa-times": '<path d="m5 5 14 14M19 5 5 19"/>',
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths[name] || paths["fa-check"]}</svg>`;
}
function renderIcons() {
  document.querySelectorAll("i.fas").forEach((icon) => {
    const name = Array.from(icon.classList).find((value) => value.startsWith("fa-"));
    icon.innerHTML = iconSVG(name);
    icon.setAttribute("aria-hidden", "true");
  });
}
